<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatFish — Fresh Catch, Delivered</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --navy:#0B2545;
    --navy-deep:#081b35;
    --teal:#0F9E93;
    --teal-light:#E4F5F3;
    --coral:#E8543E;
    --coral-dark:#c8432f;
    --cream:#F7F4EE;
    --paper:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --line:#E4E1D8;
    --radius:14px;
  }

  *{box-sizing:border-box;}

  body{
    font-family:'Work Sans', Arial, sans-serif;
    margin:0;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  header{
    background:var(--navy);
    background-image:
      radial-gradient(circle at 15% 30%, rgba(15,158,147,0.35), transparent 45%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 24px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 8px 24px rgba(8,27,53,0.25);
  }

  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.35em;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand span{color:var(--teal);}

  .cart-btn{
    background:var(--coral);
    color:white;
    padding:9px 18px;
    border-radius:999px;
    text-decoration:none;
    font-weight:600;
    font-size:0.9em;
    letter-spacing:0.02em;
    transition:background .15s ease, transform .15s ease;
  }
  .cart-btn:hover{background:var(--coral-dark); transform:translateY(-1px);}

  .hero{
    max-width:1000px;
    margin:0 auto;
    padding:34px 24px 6px;
  }
  .hero p.eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72em;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2em;
    color:var(--navy);
    margin:0;
    line-height:1.15;
  }

  .products{
    max-width:1000px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:26px 24px 60px;
  }

  .products.loading, .products.error{
    display:block;
    text-align:center;
    padding:60px 24px;
    color:var(--ink-soft);
    font-family:'Fraunces', serif;
    font-size:1.1em;
  }

  .product-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    text-align:left;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .product-card:hover{
    box-shadow:0 14px 30px rgba(11,37,69,0.1);
    transform:translateY(-2px);
  }

  .product-card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:12px;
    background:var(--teal-light);
    display:block;
  }

  .product-card h3{
    margin:0 0 4px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.12em;
    color:var(--navy);
  }

  .product-card .price{
    margin:0 0 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.9em;
    color:var(--ink-soft);
  }
  .product-card .price strong{
    color:var(--ink);
    font-weight:600;
  }

  .product-card .updated{
    margin:0 0 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.72em;
    color:#9aa2ad;
  }

  .add-btn{
    background:var(--navy);
    color:white;
    border:none;
    padding:11px;
    border-radius:9px;
    cursor:pointer;
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.9em;
    letter-spacing:0.02em;
    transition:background .15s ease;
  }
  .add-btn:hover{background:var(--teal);}

  .product-card.out-of-stock{
    opacity:0.6;
  }
  .product-card.out-of-stock img{
    filter:grayscale(60%);
  }

  .stock-badge{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:0.7em;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .stock-badge.in{
    background:var(--teal-light);
    color:var(--teal);
  }
  .stock-badge.out{
    background:#fbe4e1;
    color:var(--coral-dark);
  }

  .add-btn:disabled{
    background:#cbd2da;
    color:#6b7280;
    cursor:not-allowed;
  }

  /* FLOATING CART */
  .floating-cart{
    position:fixed;
    bottom:26px;
    right:26px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--navy);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5em;
    text-decoration:none;
    box-shadow:0 10px 26px rgba(11,37,69,0.35);
    z-index:200;
  }

  .floating-cart .pulse-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:3px solid var(--coral);
    opacity:0;
  }
  .floating-cart.pulse .pulse-ring{
    animation:pulseRing 0.7s ease-out;
  }
  .floating-cart.pulse{
    animation:pulseBump 0.35s ease-out;
  }
  @keyframes pulseRing{
    0%{ transform:scale(1); opacity:0.8; }
    100%{ transform:scale(1.7); opacity:0; }
  }
  @keyframes pulseBump{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.15); }
    100%{ transform:scale(1); }
  }

  .cart-count{
    position:absolute;
    top:-4px;
    right:-4px;
    background:var(--coral);
    color:white;
    font-family:'JetBrains Mono', monospace;
    font-size:0.42em;
    font-weight:600;
    min-width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 2px;
    border:2px solid var(--cream);
  }

  .flying-fish{
    position:fixed;
    left:0;
    top:0;
    font-size:1.6em;
    pointer-events:none;
    z-index:1500;
    filter:drop-shadow(0 4px 8px rgba(11,37,69,0.3));
  }

  /* TOAST */
  #notify{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--navy);
    color:white;
    padding:12px 22px;
    border-radius:999px;
    font-size:0.88em;
    font-weight:500;
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    z-index:1100;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  #notify.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

</head>

<body>

<header>
  <div class="brand">🐟 Chat<span>Fish</span></div>
  <a href="cart.html" class="cart-btn">Cart 🛒</a>
</header>

<div class="hero">
  <p class="eyebrow">Today's Selection</p>
  <h1>Fresh Catch, Delivered</h1>
</div>

<div class="products loading" id="products">Loading today's catch…</div>

<a href="cart.html" class="floating-cart" id="floatingCart">
  <span class="pulse-ring"></span>
  🛒
  <span class="cart-count" id="cartCount">0</span>
</a>

<div id="notify"></div>

<script>

/* ===== GOOGLE SHEET CONFIG =====
Paste your "Publish to web" CSV link below.
Google Sheets > File > Share > Publish to web >
select the responses sheet > CSV > Publish > copy the link.

Your sheet's column headers are:
Timestamp | Fish name | Price | Img ink | Stock
=============================== */

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSmq1Ce-Qw7C7aLuwI8WBeJyQX7AEWCSEiGHmtD_JxWGcFsmJ8baclRF6zliH3JXDWUZs3qfDuEUvxZ/pub?gid=190503896&single=true&output=csv"

function formatUpdated(timestamp){

if(!timestamp || String(timestamp).trim() === ""){
return null
}

let d = new Date(timestamp)

if(isNaN(d.getTime())){
return String(timestamp)
}

return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) +
" · " +
d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })

}

fetch(SHEET_CSV_URL)
.then(response => {

if(!response.ok){
throw new Error("Network response not OK")
}

return response.text()

})

.then(csvText => {

let parsed = Papa.parse(csvText, { header:true, skipEmptyLines:true })

console.log("SHEET DATA:", parsed.data)

let container=document.getElementById("products")

container.classList.remove("loading")
container.innerHTML=""

let rows = parsed.data.map(r => ({
fish:r["Fish name"],
price:r["Price"],
imageLink:r["Img ink"],
inStock:r["Stock"],
timestamp:r["Timestamp"]
}))

/* Keep only the most recent submission per fish name,
so resubmitting the form updates or removes a product
without ever editing the sheet directly. */

let latestByFish = {}

rows.forEach(r=>{

if(!r.fish || String(r.fish).trim() === ""){
return
}

let key = String(r.fish).trim().toLowerCase()
let time = new Date(r.timestamp).getTime() || 0

if(!latestByFish[key] || time >= latestByFish[key]._time){
latestByFish[key] = { ...r, _time:time }
}

})

let deduped = Object.values(latestByFish)

let products=deduped.filter(p =>
p.fish && String(p.fish).trim() !== "" &&
p.price !== undefined && p.price !== null && String(p.price).trim() !== "" &&
p.imageLink && String(p.imageLink).trim() !== "" &&
String(p.inStock).trim().toLowerCase() !== "remove"
)

if(products.length === 0){

container.classList.add("error")
container.innerHTML = "No fish available right now — check back soon 🐟"
return

}

products.forEach(p=>{

let inStock = String(p.inStock).trim().toLowerCase() === "yes"
let updated = formatUpdated(p.timestamp)

container.innerHTML += `

<div class="product-card ${inStock ? "" : "out-of-stock"}">

<img src="${p.imageLink}" alt="${p.fish}">

<span class="stock-badge ${inStock ? "in" : "out"}">${inStock ? "In Stock" : "Out of Stock"}</span>

<h3>${p.fish}</h3>

<p class="price">Fresh today &middot; <strong>QAR ${p.price}</strong></p>

${updated ? `<p class="updated">Last updated: ${updated}</p>` : ""}

<button class="add-btn" ${inStock ? "" : "disabled"} onclick="addToCart('${p.fish}','${p.price}',this)">
${inStock ? "Add to Cart" : "Out of Stock"}
</button>

</div>

`

})

})

.catch(error => {

console.error(error)

let container=document.getElementById("products")
container.classList.remove("loading")
container.classList.add("error")

container.innerHTML = `
❌ Failed to load today's catch<br><br>
Check your connection and try again
`

})

function addToCart(name,price,btn){

let cart=JSON.parse(localStorage.getItem("cart")) || []

cart.push({
name:name,
price:Number(price),
qty:1
})

localStorage.setItem("cart",JSON.stringify(cart))

showNotification(name+" added to cart 🐟")
updateCartCount()

if(btn){
launchFish(btn)
}else{
pulseCart()
}

}

function launchFish(originEl){

if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
pulseCart()
return
}

const cartBtn=document.getElementById("floatingCart")

const startRect=originEl.getBoundingClientRect()
const endRect=cartBtn.getBoundingClientRect()

const startX=startRect.left+startRect.width/2
const startY=startRect.top+startRect.height/2
const endX=endRect.left+endRect.width/2
const endY=endRect.top+endRect.height/2

const controlX=(startX+endX)/2
const controlY=Math.min(startY,endY)-140

const fish=document.createElement("div")
fish.className="flying-fish"
fish.innerText="🐟"
document.body.appendChild(fish)

const duration=700
const startTime=performance.now()

function animate(now){

let t=Math.min((now-startTime)/duration,1)

const x=(1-t)*(1-t)*startX + 2*(1-t)*t*controlX + t*t*endX
const y=(1-t)*(1-t)*startY + 2*(1-t)*t*controlY + t*t*endY

const scale=1-0.55*t
const rotate=380*t

fish.style.transform=
`translate(${x}px, ${y}px) translate(-50%,-50%) scale(${scale}) rotate(${rotate}deg)`
fish.style.opacity=1-t*0.25

if(t<1){
requestAnimationFrame(animate)
}else{
fish.remove()
pulseCart()
}

}

requestAnimationFrame(animate)

}

function updateCartCount(){

let cart=JSON.parse(localStorage.getItem("cart")) || []

let count=cart.reduce((sum,item)=>sum+(item.qty||1),0)

document.getElementById("cartCount").innerText=count

}

function pulseCart(){

const cartBtn=document.getElementById("floatingCart")

cartBtn.classList.remove("pulse")

void cartBtn.offsetWidth

cartBtn.classList.add("pulse")

}

function showNotification(msg){
const n=document.getElementById("notify")
n.innerText=msg
n.classList.add("show")
setTimeout(()=>{n.classList.remove("show")},1500)
}

updateCartCount()

</script>

</body>
</html>
