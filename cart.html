<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatFish — Your Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0B2545;
    --navy-deep:#081b35;
    --teal:#0F9E93;
    --teal-light:#E4F5F3;
    --coral:#E8543E;
    --coral-dark:#c8432f;
    --cream:#F7F4EE;
    --paper:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --line:#E4E1D8;
    --radius:14px;
  }

  *{box-sizing:border-box;}

  body{
    font-family:'Work Sans', Arial, sans-serif;
    background:var(--cream);
    color:var(--ink);
    margin:0;
    padding:0 0 40px;
    -webkit-font-smoothing:antialiased;
  }

  header{
    background:var(--navy);
    background-image:
      radial-gradient(circle at 15% 30%, rgba(15,158,147,0.35), transparent 45%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:white;
    padding:24px 20px 28px;
    text-align:center;
    box-shadow:0 8px 24px rgba(8,27,53,0.25);
  }

  h2{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7em;
    letter-spacing:0.2px;
  }
  h2 span{color:var(--teal);}
  .header-tag{
    margin-top:6px;
    font-size:0.78em;
    color:rgba(255,255,255,0.6);
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:500;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 20px;
  }

  .section-label{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72em;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:26px 0 14px;
  }

  #cart p{
    text-align:center;
    color:var(--ink-soft);
    font-family:'Fraunces', serif;
    font-size:1.1em;
    padding:40px 0;
  }

  /* CART ITEM */
  .cart-item{
    background:var(--paper);
    border:1px solid var(--line);
    padding:16px;
    border-radius:var(--radius);
    margin-bottom:12px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .cart-item:hover{
    box-shadow:0 10px 24px rgba(11,37,69,0.08);
    transform:translateY(-1px);
  }
  .cart-item b{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.08em;
    color:var(--navy);
  }
  .cart-item p{
    margin:4px 0 0;
    font-family:'JetBrains Mono', monospace;
    font-size:0.85em;
    color:var(--ink-soft);
  }

  .item-controls{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }

  .qty-stepper{
    display:inline-flex;
    align-items:center;
    background:var(--cream);
    border-radius:8px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .qty-stepper button{
    width:32px;
    height:32px;
    border:none;
    background:transparent;
    color:var(--navy);
    font-size:1.1em;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .qty-stepper button:hover{background:var(--teal-light);}
  .qty-stepper span{
    min-width:26px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:0.9em;
  }

  .type-select{
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--cream);
    font-family:'Work Sans', sans-serif;
    font-size:0.82em;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .type-select:focus{
    outline:none;
    border-color:var(--teal);
  }

  .remove{
    background:none;
    border:none;
    color:var(--coral);
    font-size:0.85em;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    padding:6px 4px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .remove:hover{color:var(--coral-dark);}

  /* TOTAL / TICKET */
  .total-box{
    background:var(--navy);
    background-image:radial-gradient(circle at 90% 0%, rgba(15,158,147,0.3), transparent 55%);
    color:white;
    padding:24px;
    border-radius:var(--radius);
    margin-top:24px;
    text-align:center;
  }
  .total-box h3{
    margin:0 0 4px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.75em;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.6);
    font-weight:500;
  }
  .total-amount{
    font-family:'Fraunces', serif;
    font-size:2em;
    font-weight:600;
  }
  .total-amount .code{
    font-family:'JetBrains Mono', monospace;
    font-size:0.42em;
    color:var(--teal);
    vertical-align:middle;
    margin-right:4px;
  }

  .order{
    background:var(--coral);
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:10px;
    cursor:pointer;
    margin-top:18px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.95em;
    letter-spacing:0.02em;
    transition:background .15s ease, transform .15s ease;
  }
  .order:hover{background:var(--coral-dark); transform:translateY(-1px);}

  /* POPUPS */
  .popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(8,27,53,0.55);
    backdrop-filter:blur(2px);
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }

  .popup-box{
    background:var(--paper);
    padding:26px;
    border-radius:16px;
    width:100%;
    max-width:420px;
    max-height:90vh;
    overflow-y:auto;
    box-shadow:0 24px 60px rgba(8,27,53,0.3);
  }
  .popup-box h3{
    margin:0 0 14px;
    font-family:'Fraunces', serif;
    font-weight:600;
    color:var(--navy);
    font-size:1.3em;
  }

  #orderItems p{
    margin:0 0 6px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.85em;
    color:var(--ink-soft);
    padding-bottom:6px;
    border-bottom:1px dashed var(--line);
  }

  #orderTotal{
    font-family:'JetBrains Mono', monospace;
  }
  .popup-box h4{
    font-family:'Fraunces', serif;
    color:var(--navy);
    font-weight:600;
    margin:12px 0 18px;
  }

  /* INPUTS */
  input, textarea{
    width:100%;
    padding:12px 14px;
    margin-top:10px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--cream);
    font-family:'Work Sans', sans-serif;
    font-size:0.95em;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--teal);
    background:var(--paper);
    box-shadow:0 0 0 3px var(--teal-light);
  }
  input::placeholder, textarea::placeholder{color:#9aa2ad;}
  textarea{resize:vertical; min-height:70px;}

  .location{
    background:var(--teal-light);
    color:var(--navy);
    border:1px solid var(--teal);
    padding:11px;
    margin-top:12px;
    border-radius:9px;
    width:100%;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.9em;
    transition:background .15s ease;
  }
  .location:hover{background:#d3efec;}

  /* SUBMIT BUTTON */
  .submit{
    background:var(--coral);
    color:white;
    border:none;
    padding:13px;
    margin-top:14px;
    border-radius:9px;
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.95em;
    letter-spacing:0.02em;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:background .15s ease;
  }
  .submit:hover{background:var(--coral-dark);}

  /* RIPPLE EFFECT */
  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.6);
    transform:scale(0);
    animation:ripple 0.6s linear;
    pointer-events:none;
  }
  @keyframes ripple{
    to{ transform:scale(4); opacity:0; }
  }

  /* THANK POPUP */
  .thank{ text-align:center; }
  .thank h3{
    font-size:1.4em;
  }
  .thank p{
    color:var(--ink-soft);
    line-height:1.5;
    font-size:0.95em;
  }
  .thank b{color:var(--navy);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

</head>

<body>

<header>
  <h2>🐟 Chat<span>Fish</span></h2>
  <div class="header-tag">Fresh Catch, Delivered</div>
</header>

<div class="wrap">

<p class="section-label">Your Selection</p>
<div id="cart"></div>

<div class="total-box">
<h3>Order Total</h3>
<div class="total-amount"><span class="code">QAR</span><span id="total">0</span></div>
<button class="order" onclick="openPopup()">Place Order</button>
</div>

</div>

<!-- ORDER POPUP -->

<div class="popup" id="orderPopup">

<div class="popup-box">

<h3>Your Order</h3>

<div id="orderItems"></div>

<h4>Total: QAR <span id="orderTotal"></span></h4>

<form id="orderForm">

<input type="hidden" name="access_key" value="f7d95d60-9db1-434f-8811-d3ddb80d5b72">

<input type="hidden" name="subject" value="New ChatFish Order">

<input type="hidden" name="order_details" id="orderDetails">

<input type="text" name="customer_name" placeholder="Customer Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<textarea name="address" id="custAddress" placeholder="Delivery Address" required></textarea>

<button type="button" class="location" onclick="getLocation()">
📍 Share Current Location
</button>

<button type="submit" class="submit">
Submit Order
</button>

</form>

</div>

</div>

<!-- THANK YOU POPUP -->

<div class="popup" id="thankPopup">

<div class="popup-box thank">

<h3>✅ Thank You!</h3>

<p>
Thank you for reaching <b>ChatFish</b> 🐟<br>
Our member will deliver your fish soon.
</p>

<button class="submit" onclick="closeThank()">
OK
</button>

</div>

</div>

<script>

/* LOAD CART */

let cart = JSON.parse(localStorage.getItem("cart")) || []

let container = document.getElementById("cart")

let total = 0

if(cart.length === 0){
container.innerHTML="<p>Your cart is empty</p>"
}

cart.forEach((item,index)=>{

let qty = item.qty || 1
let type = item.type || "Whole"
let price = Number(item.price)*qty

total += price

container.innerHTML += `

<div class="cart-item">

<div>
<b>${item.name}</b>
<p>${qty} kg &middot; QAR ${price}</p>
</div>

<div class="item-controls">

<div class="qty-stepper">
<button onclick="changeQty(${index},-1)">−</button>
<span>${qty}</span>
<button onclick="changeQty(${index},1)">+</button>
</div>

<select class="type-select" onchange="changeType(${index},this.value)">
<option value="Whole" ${type==="Whole" ? "selected" : ""}>Whole</option>
<option value="Piece" ${type==="Piece" ? "selected" : ""}>Piece</option>
</select>

<button class="remove" onclick="removeItem(${index})">
Remove
</button>

</div>

</div>

`

})

document.getElementById("total").innerText = total

/* CHANGE QUANTITY */

function changeQty(i,delta){

let qty = cart[i].qty || 1
qty += delta

if(qty < 1){
return
}

cart[i].qty = qty

localStorage.setItem("cart",JSON.stringify(cart))

location.reload()

}

/* CHANGE TYPE */

function changeType(i,value){

cart[i].type = value

localStorage.setItem("cart",JSON.stringify(cart))

}

/* REMOVE ITEM */

function removeItem(i){

cart.splice(i,1)

localStorage.setItem("cart",JSON.stringify(cart))

location.reload()

}

/* OPEN ORDER POPUP */

function openPopup(){

if(cart.length === 0){
alert("Cart is empty")
return
}

document.getElementById("orderPopup").style.display="flex"

let itemsHTML=""
let orderText=""
let orderTotal=0

cart.forEach(item=>{

let qty=item.qty || 1
let type=item.type || "Whole"
let price=Number(item.price)*qty

orderTotal+=price

itemsHTML += `<p>${item.name} (${type}) — ${qty}kg — QAR ${price}</p>`

orderText += `${item.name} (${type}) - ${qty}kg - QAR ${price}\n`

})

orderText += `Total: QAR ${orderTotal}`

document.getElementById("orderItems").innerHTML=itemsHTML
document.getElementById("orderTotal").innerText=orderTotal
document.getElementById("orderDetails").value=orderText

}

/* GET LOCATION */

function getLocation(){

if(!navigator.geolocation){
alert("Location not supported")
return
}

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude
let lon=pos.coords.longitude

document.getElementById("custAddress").value =
"https://maps.google.com/?q="+lat+","+lon

})

}

/* SUBMIT ORDER */

document.getElementById("orderForm").addEventListener("submit", async function(e){

e.preventDefault()

let form = document.getElementById("orderForm")
let data = new FormData(form)

let response = await fetch("https://api.web3forms.com/submit",{
method:"POST",
body:data
})

let result = await response.json()

if(result.success){

document.getElementById("orderPopup").style.display="none"
document.getElementById("thankPopup").style.display="flex"

let customerName = data.get("customer_name")
let orderDetails = data.get("order_details")

let whatsappMessage =
`New ChatFish Order\n\nCustomer: ${customerName}\n\n${orderDetails}`

let whatsappNumber = "97450366227"

let whatsappURL =
"https://wa.me/"+whatsappNumber+"?text="+encodeURIComponent(whatsappMessage)

window.open(whatsappURL, "_blank")

localStorage.removeItem("cart")

}else{
alert("Failed to send order")
}

})

function closeThank(){
document.getElementById("thankPopup").style.display="none"
location.reload()
}

/* SPLASH RIPPLE EFFECT */

document.querySelectorAll(".submit").forEach(button=>{

button.addEventListener("click",function(e){

let circle=document.createElement("span")
circle.classList.add("ripple")

let rect=this.getBoundingClientRect()
let size=Math.max(rect.width,rect.height)

circle.style.width=size+"px"
circle.style.height=size+"px"

circle.style.left=(e.clientX-rect.left-size/2)+"px"
circle.style.top=(e.clientY-rect.top-size/2)+"px"

this.appendChild(circle)

setTimeout(()=>{
circle.remove()
},600)

})

})

</script>

</body>
</html>
